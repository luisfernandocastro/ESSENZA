<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESSENZA — Perfumería</title>
<link href="https://fonts.googleapis.com/css2?family=Italiana&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body { font-family:'Jost',sans-serif; background:#0b0b12; color:#e8e6f0; min-height:100vh; overflow-x:hidden; }
  body::before { content:''; position:fixed; inset:0; background:radial-gradient(600px 400px at 15% 10%, rgba(201,162,106,.12), transparent 60%), radial-gradient(700px 500px at 85% 80%, rgba(124,92,186,.14), transparent 60%); pointer-events:none; }
  @keyframes fadeUp { from { opacity:0; transform:translateY(24px); } to { opacity:1; transform:translateY(0); } }
  @keyframes glow { 0%,100% { text-shadow:0 0 18px rgba(201,162,106,.35); } 50% { text-shadow:0 0 34px rgba(201,162,106,.7); } }
  header { position:sticky; top:0; z-index:10; backdrop-filter:blur(14px); background:rgba(11,11,18,.7); border-bottom:1px solid rgba(201,162,106,.25); padding:18px 48px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; }
  header .logo { font-family:'Italiana',serif; font-size:28px; letter-spacing:12px; text-transform:uppercase; background:linear-gradient(90deg,#e8d5a3,#c9a26a,#f5e3b8); -webkit-background-clip:text; background-clip:text; color:transparent; }
  nav a { color:#b9b4c9; text-decoration:none; margin-left:26px; font-size:12px; letter-spacing:3px; text-transform:uppercase; position:relative; transition:color .3s; }
  nav a::after { content:''; position:absolute; left:0; bottom:-6px; width:0; height:1px; background:#c9a26a; transition:width .35s; }
  nav a:hover { color:#e8d5a3; }
  nav a:hover::after { width:100%; }
  main { max-width:1100px; margin:50px auto; padding:0 24px; animation:fadeUp .8s ease both; }
  h1, h2 { font-family:'Italiana',serif; font-weight:400; letter-spacing:5px; text-transform:uppercase; }
  h2 { font-size:20px; color:#c9a26a; border-bottom:1px solid rgba(201,162,106,.25); padding-bottom:10px; margin:56px 0 26px; }
  .hero { text-align:center; padding:80px 0 20px; }
  .hero h1 { font-size:64px; letter-spacing:18px; background:linear-gradient(90deg,#f5e3b8,#c9a26a,#b48ec7); -webkit-background-clip:text; background-clip:text; color:transparent; animation:glow 4s ease-in-out infinite; }
  .hero p { color:#8f89a3; font-style:italic; font-size:18px; margin-top:14px; letter-spacing:2px; }
  .page-header { text-align:center; margin-bottom:40px; }
  .page-header h1 { font-size:40px; color:#f5e3b8; }
  .page-header p { color:#8f89a3; font-style:italic; letter-spacing:2px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:28px; }
  .card { background:rgba(255,255,255,.04); border:1px solid rgba(201,162,106,.18); border-radius:16px; padding:20px; text-align:center; backdrop-filter:blur(8px); transition:transform .35s cubic-bezier(.2,.8,.2,1), border-color .35s, box-shadow .35s; animation:fadeUp .7s ease both; }
  .card:nth-child(2){animation-delay:.08s}.card:nth-child(3){animation-delay:.16s}.card:nth-child(4){animation-delay:.24s}
  .card:hover { transform:translateY(-10px) scale(1.02); border-color:rgba(201,162,106,.6); box-shadow:0 20px 44px rgba(0,0,0,.5), 0 0 24px rgba(201,162,106,.15); }
  .card img, .img-ph { width:100%; height:200px; object-fit:cover; border-radius:12px; margin-bottom:16px; }
  .img-ph { background:linear-gradient(135deg,rgba(201,162,106,.15),rgba(124,92,186,.2)); display:flex; align-items:center; justify-content:center; font-size:44px; color:#c9a26a; }
  .card h3 { font-family:'Italiana',serif; font-size:22px; letter-spacing:3px; color:#f0ead6; }
  .card .marca { color:#c9a26a; font-style:italic; margin:4px 0 12px; letter-spacing:2px; }
  .card .precio { font-size:20px; color:#e8d5a3; letter-spacing:1px; }
  .meta { color:#8f89a3; font-size:13px; letter-spacing:1px; }
  table { width:100%; border-collapse:collapse; background:rgba(255,255,255,.03); border-radius:16px; overflow:hidden; border:1px solid rgba(201,162,106,.18); }
  th, td { padding:15px 20px; text-align:left; border-bottom:1px solid rgba(255,255,255,.06); }
  th { background:linear-gradient(90deg,rgba(201,162,106,.2),rgba(124,92,186,.2)); color:#e8d5a3; text-transform:uppercase; font-size:11px; letter-spacing:3px; }
  tr:hover td { background:rgba(201,162,106,.06); }
  .btn { display:inline-block; background:transparent; border:1px solid #c9a26a; color:#e8d5a3; padding:12px 30px; letter-spacing:3px; text-transform:uppercase; font-size:12px; border-radius:40px; cursor:pointer; transition:all .35s; }
  .btn:hover { background:#c9a26a; color:#0b0b12; box-shadow:0 0 22px rgba(201,162,106,.5); }
  form input, form textarea, form select { width:100%; padding:13px 18px; border:1px solid rgba(201,162,106,.25); border-radius:12px; background:rgba(255,255,255,.05); color:#e8e6f0; margin-bottom:14px; font-family:inherit; }
  form input:focus, form textarea:focus { outline:none; border-color:#c9a26a; box-shadow:0 0 12px rgba(201,162,106,.25); }
  .resena { background:rgba(255,255,255,.04); border-left:2px solid #c9a26a; border-radius:12px; padding:16px 20px; margin-bottom:14px; animation:fadeUp .6s ease both; }
  .estrellas { color:#e8c97a; letter-spacing:4px; }
  footer { text-align:center; color:#5e5973; font-size:11px; letter-spacing:5px; padding:60px 0; text-transform:uppercase; }
</style>
</head>
<body>
<header>
  <div class="logo">Essenza</div>
  <nav>
    <a href="{% url 'inicio' %}">Inicio</a>
    <a href="{% url 'catalogo' %}">Catálogo</a>
    <a href="{% url 'resenas' %}">Reseñas</a>
    <a href="/admin/">Admin</a>
  </nav>
</header>
<main>
{% block contenido %}{% endblock %}
</main>
<footer>Essenza · Fragancias con alma</footer>
</body>
</html>
